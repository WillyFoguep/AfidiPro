// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.browser:browser:1.8.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Patch to fix Capacitor ProGuard issue
def fixCapacitorProguard() {
    def capacitorDir = new File(rootProject.projectDir, "../node_modules/@capacitor")
    if (!capacitorDir.exists() || !capacitorDir.isDirectory()) {
        return
    }
    
    capacitorDir.eachDir { moduleDir ->
        // Standard path for most plugins
        def buildFile = new File(moduleDir, "android/build.gradle")
        if (buildFile.exists()) {
            fixFile(buildFile, moduleDir.name)
        }
        // Special path for @capacitor/android plugin
        def legacyBuildFile = new File(moduleDir, "capacitor/build.gradle")
        if (legacyBuildFile.exists()) {
            fixFile(legacyBuildFile, moduleDir.name + "/capacitor")
        }
    }
}

def fixFile(File file, String name) {
    def content = file.getText('UTF-8')
    def updated = content

    if (content.contains("proguard-android.txt")) {
        updated = updated.replace("getDefaultProguardFile('proguard-android.txt')", "getDefaultProguardFile('proguard-android-optimize.txt')")
        println "✓ Fixed ProGuard in @capacitor/" + name
    }

    if (content.contains("JavaVersion.VERSION_21")) {
        updated = updated.replace("JavaVersion.VERSION_21", "JavaVersion.VERSION_17")
        println "✓ Forced Java 17 in @capacitor/" + name
    }

    if (updated != content) {
        file.write(updated, 'UTF-8')
    }
}

fixCapacitorProguard()
